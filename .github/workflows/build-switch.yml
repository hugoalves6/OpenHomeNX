name: Build Switch app

on:
  workflow_dispatch:
  push:
    branches: [lan-staged-edits]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain nightly
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add rust-src --toolchain nightly
          "$HOME/.cargo/bin/rustup" target add aarch64-unknown-none --toolchain nightly
      - name: Build release package
        run: |
          chmod +x release.sh
          ./release.sh release
      - uses: actions/upload-artifact@v4
        with:
          name: OpenHomeNX-0.3.8
          path: |
            dist/OpenHomeNX.nro
            dist/latest.json
          if-no-files-found: error
